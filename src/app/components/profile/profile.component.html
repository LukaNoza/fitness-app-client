<div class="profile-container">
  <div class="profile-header">
    <h1>👤 My Profile</h1>
    <p class="subtitle">Manage your personal information</p>
  </div>

  <div class="profile-card">
    <form (ngSubmit)="onSubmit()" class="profile-form">
      
      <!-- Avatar Section -->
      <div class="avatar-section">
        <div class="avatar">
          <span class="avatar-icon">{{ user?.firstName?.[0] }}{{ user?.lastName?.[0] }}</span>
        </div>
        <div class="avatar-actions">
          <button type="button" (click)="uploadAvatar()" class="btn-upload">📷 Upload Photo</button>
          <input type="file" #fileInput style="display: none" accept="image/*" (change)="onFileSelected($event)">
        </div>
      </div>

      <!-- Personal Information -->
      <div class="form-section">
        <h3>📋 Personal Information</h3>
        <div class="form-row">
          <div class="form-group">
            <label>First Name *</label>
            <input type="text" [(ngModel)]="user.firstName" name="firstName" required>
          </div>
          <div class="form-group">
            <label>Last Name *</label>
            <input type="text" [(ngModel)]="user.lastName" name="lastName" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Email *</label>
            <input type="email" [(ngModel)]="user.email" name="email" required>
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" [(ngModel)]="user.phoneNumber" name="phoneNumber">
          </div>
        </div>
      </div>

      <!-- Change Password Section with Show/Hide -->
      <div class="form-section">
        <h3>🔐 Change Password</h3>
        <div class="form-row">
          <div class="form-group">
            <label>Current Password</label>
            <div class="password-wrapper">
              <input [type]="showCurrentPassword ? 'text' : 'password'" 
                    [(ngModel)]="passwordData.currentPassword" 
                    name="currentPassword"
                    autocomplete="off"
                    placeholder="Enter current password">
              <button type="button" class="toggle-password" (click)="toggleCurrentPassword()">
                {{ showCurrentPassword ? '🙈' : '👁️' }}
              </button>
            </div>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>New Password</label>
            <div class="password-wrapper">
              <input [type]="showNewPassword ? 'text' : 'password'" 
                    [(ngModel)]="passwordData.newPassword" 
                    name="newPassword"
                    autocomplete="new-password"
                    placeholder="Enter new password">
              <button type="button" class="toggle-password" (click)="toggleNewPassword()">
                {{ showNewPassword ? '🙈' : '👁️' }}
              </button>
            </div>
          </div>
          <div class="form-group">
            <label>Confirm New Password</label>
            <div class="password-wrapper">
              <input [type]="showConfirmPassword ? 'text' : 'password'" 
                    [(ngModel)]="passwordData.confirmPassword" 
                    name="confirmPassword"
                    autocomplete="new-password"
                    placeholder="Confirm new password">
              <button type="button" class="toggle-password" (click)="toggleConfirmPassword()">
                {{ showConfirmPassword ? '🙈' : '👁️' }}
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="form-actions">
        <button type="button" (click)="cancel()" class="btn-cancel">Cancel</button>
        <button type="submit" [disabled]="loading" class="btn-save">
          {{ loading ? 'Saving...' : '💾 Save Changes' }}
        </button>
      </div>

      <!-- Message -->
      @if (message) {
        <div class="message" [class.success]="messageType === 'success'" [class.error]="messageType === 'error'">
          {{ message }}
        </div>
      }

    </form>
  </div>
</div>
