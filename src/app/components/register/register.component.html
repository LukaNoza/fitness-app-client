
<!-- Back Button - ზევით მარცხნივ -->
<button class="btn-back" (click)="goBack()">
  ← Back
</button>

<!-- register.component.html -->
<div class="register-container">
  <div class="register-card">
    <h2>📝 Create Account</h2>
    <p class="subtitle">Join FitnessApp today</p>
    
    <form (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="form-group">
          <label>First Name *</label>
          <input type="text" [(ngModel)]="firstName" name="firstName" required>
        </div>
        <div class="form-group">
          <label>Last Name *</label>
          <input type="text" [(ngModel)]="lastName" name="lastName" required>
        </div>
      </div>
      
      <div class="form-group">
        <label>Email *</label>
        <input type="email" [(ngModel)]="email" name="email" required>
      </div>
      
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" [(ngModel)]="phoneNumber" name="phoneNumber">
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label>Password *</label>
          <input type="password" [(ngModel)]="password" name="password" required>
        </div>
        <div class="form-group">
          <label>Confirm Password *</label>
          <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required>
        </div>
      </div>
      
      <div class="form-group">
        <label>I am a *</label>
        <select [(ngModel)]="userType" name="userType">
          <option value="Client">💪 Client</option>
          <option value="Trainer">🏋️ Trainer</option>
        </select>
      </div>
      
      <button type="submit" [disabled]="loading">
        {{ loading ? 'Creating account...' : '🚀 Register' }}
      </button>
      
      @if (error) {
        <div class="error">{{ error }}</div>
      }
      
      <p class="login-link">
        Already have an account? <a routerLink="/login">Login here</a>
      </p>
    </form>
  </div>
</div>
